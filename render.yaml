services:
  - type: web
    name: sunumarket-api
    runtime: node
    plan: starter
    buildCommand: |
      if [ -f server/package.json ]; then
        npm install --prefix server
      else
        npm install
      fi
    startCommand: |
      if [ -f server/server.js ]; then
        node server/server.js
      else
        node server.js
      fi
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/sunumarket.db
    disk:
      name: sunumarket-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: sunumarket-web
    runtime: static
    buildCommand: mkdir -p dist && cp index.html app.js style.css brochure-sunumarket.html sunumarket-logo.svg sunumarket-logo.png sunumarket-logo.svgz robots.txt sitemap.xml google5fe9ad8e0af33673.html dist/
    staticPublishPath: dist
