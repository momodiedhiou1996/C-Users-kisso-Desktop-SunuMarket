services:
  - type: web
    name: sunumarket-api
    runtime: node
    plan: starter
    buildCommand: |
      if [ -f server/package.json ]; then
        npm install --prefix server
      else
        npm install
      fi
    startCommand: |
      if [ -f server/server.js ]; then
        node server/server.js
      else
        node server.js
      fi
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/sunumarket.db
    disk:
      name: sunumarket-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: sunumarket-web
    runtime: static
    buildCommand: |
      mkdir -p dist
      cp index.html app.js style.css brochure-sunumarket.html sunumarket-logo.svg sunumarket-logo.png sunumarket-logo.svgz dist/
      if [ -f robots.txt ]; then
        cp robots.txt dist/
      else
        printf 'User-agent: *\nAllow: /\n\nSitemap: https://sunumarket-web.onrender.com/sitemap.xml\n' > dist/robots.txt
      fi
      if [ -f sitemap.xml ]; then
        cp sitemap.xml dist/
      else
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' '  <url>' '    <loc>https://sunumarket-web.onrender.com/</loc>' '    <lastmod>2026-05-21</lastmod>' '    <changefreq>daily</changefreq>' '    <priority>1.0</priority>' '  </url>' '</urlset>' > dist/sitemap.xml
      fi
      for f in google*.html; do
        [ -e "$f" ] || continue
        cp "$f" dist/
      done
    staticPublishPath: dist
